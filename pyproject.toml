[project]
name = "flow-mcp"
version = "0.1.0"
description = "Flow MCP Stack - Intelligent orchestration for AI-assisted development"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Flow Team" }
]
keywords = ["mcp", "ai", "orchestration", "memory", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/Q-types/flow-mcp"
Documentation = "https://github.com/Q-types/flow-mcp#readme"
Repository = "https://github.com/Q-types/flow-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages"]

# Development dependencies
[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "mypy>=1.0",
    "ruff>=0.1",
]

# Individual package installation
[tool.uv.sources]
architect = { path = "packages/architect" }
mind = { path = "packages/mind" }
muse = { path = "packages/muse" }
forgeloop = { path = "packages/forgeloop" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages/*/tests"]
