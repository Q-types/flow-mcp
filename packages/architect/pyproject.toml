[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "architect-mcp"
version = "0.1.0"
description = "Architect MCP Server - Orchestration layer for vibe coding projects"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Architect Team" }
]
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.0.0",
    "tenacity>=8.2.0",
    "aiofiles>=23.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[project.scripts]
architect-mcp = "architect_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/architect_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
