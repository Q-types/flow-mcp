[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mind-mcp"
version = "2.0.0"
description = "Long-term memory MCP server for Claude with semantic search"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Q" }
]
keywords = ["mcp", "memory", "embeddings", "claude", "semantic-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "mcp>=1.0.0",
    "sentence-transformers>=2.2.0",
    "numpy>=1.24.0",
    "einops>=0.7.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
mind-mcp = "mind_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mind_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
