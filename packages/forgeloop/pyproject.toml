[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forgeloop-mcp"
version = "0.1.0"
description = "Iterative engineering orchestration MCP server for AI coding agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "qtypes" }
]
keywords = ["mcp", "ai", "coding", "engineering", "orchestration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
forgeloop-mcp = "forgeloop_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/forgeloop_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
