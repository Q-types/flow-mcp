[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "muse-mcp"
version = "0.1.0"
description = "Associative working-memory MCP server for creative recombination and selective promotion"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "sentence-transformers>=2.2.0",
    "numpy>=1.24.0",
]

[project.scripts]
muse-mcp = "muse_mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["src/muse_mcp"]
